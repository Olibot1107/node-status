name: Export Blueprint

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Blueprint Export
        uses: blueprint-community/action-export@v1.0.0
      
      - name: Rename to blueprint.blueprint
        run: echo i cba to chaneg shit
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: node-status.blueprint
          name: node-status.blueprint
          tag_name: ${{ github.run_number }}-${{ github.run_id }}
          generate_release_notes: true